<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weekly Split">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><g fill='%23ffffff'><rect x='32' y='45' width='36' height='10' rx='3'/><rect x='22' y='34' width='10' height='32' rx='3'/><rect x='14' y='39' width='8' height='22' rx='2'/><rect x='68' y='34' width='10' height='32' rx='3'/><rect x='78' y='39' width='8' height='22' rx='2'/></g></svg>">
<title>Weekly Split</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0f19;
    --bg-2: rgba(20, 26, 40, 0.7);
    --card: rgba(25, 33, 52, 0.55);
    --line: rgba(255, 255, 255, 0.08);
    --text: #f8fafc;
    --text-dim: #94a3b8;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-dim: rgba(37, 99, 235, 0.25);
    --sage: #10b981;
    --danger: #ef4444;
  }
  html {
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1, h2, h3, .display {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1.15;
  }
  .sticky-header-wrap {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(11, 15, 25, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
  }
  header {
    padding: 16px 18px 8px;
  }
  .head-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 10px;
  }
  header h1 {
    font-size: 22px;
    margin: 0 0 2px;
    font-weight: 700;
    color: var(--text);
  }
  header p {
    margin: 0;
    font-size: 13px;
    color: var(--text-dim);
  }
  .view-toggle {
    display: flex;
    gap: 4px;
    background: var(--bg-2);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  .view-toggle button {
    border: none;
    background: none;
    color: var(--text-dim);
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 0.03em;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .view-toggle button.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 0 16px rgba(37, 99, 235, 0.4);
  }
  nav {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 0 18px 10px;
  }
  nav::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    padding: 8px 14px;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    border-bottom: 3px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    transition: color 0.2s;
  }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  main {
    padding: 18px;
    max-width: 640px;
    margin: 0 auto;
    padding-bottom: 120px;
  }

  /* Sliding Transitions */
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .slide-right {
    animation: slideInRight 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .slide-left {
    animation: slideInLeft 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .day-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }
  .day-title h2 {
    font-size: 26px;
    margin: 0;
    font-weight: 700;
    line-height: 1.1;
  }
  .day-sub {
    color: var(--accent);
    font-size: 13px;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.03em;
  }
  .last-logged {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }
  .rest-card, .cardio-card {
    background: var(--card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 18px;
    text-align: left;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .rest-card h3, .cardio-card h3 {
    margin: 0 0 8px;
    font-size: 18px;
    color: var(--sage);
  }
  .rest-card p, .cardio-card p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14.5px;
    line-height: 1.5;
  }
  .exercise {
    background: var(--card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  .ex-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }
  .ex-name {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 2px;
    line-height: 1.3;
  }
  .ex-target {
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .ex-history {
    font-size: 11.5px;
    color: var(--accent-dim);
    text-align: right;
    white-space: nowrap;
    padding-top: 2px;
    filter: brightness(1.4);
  }
  .sets-grid {
    display: grid;
    grid-template-columns: 32px 1fr 1fr;
    gap: 8px;
    align-items: center;
  }
  .set-label {
    font-size: 12px;
    color: var(--text-dim);
    font-family: 'Oswald', sans-serif;
  }
  .col-label {
    font-size: 10.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .start-workout-row {
    margin-bottom: 18px;
  }
  .start-workout-btn {
    width: 100%;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    margin-bottom: 8px;
    box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
    transition: all 0.2s;
  }
  .start-workout-btn:active {
    transform: scale(0.98);
  }
  .guided-config {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .config-pill {
    background: var(--card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .guided-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(11, 15, 25, 0.92);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  .guided-close {
    position: absolute;
    top: calc(20px + env(safe-area-inset-top, 0px));
    right: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text-dim);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }
  .guided-progress {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .guided-exname {
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 2px;
    text-transform: uppercase;
    line-height: 1.2;
  }
  .guided-setinfo {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 28px;
  }
  .guided-phase {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .guided-phase.work { color: var(--accent); }
  .guided-phase.rest { color: var(--sage); }
  .guided-timer {
    font-family: 'Oswald', sans-serif;
    font-size: 84px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 8px;
  }
  .guided-timer.work { color: var(--accent); }
  .guided-timer.rest { color: var(--sage); }
  .guided-next {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 34px;
    min-height: 18px;
  }
  .guided-controls {
    display: flex;
    gap: 12px;
  }
  .guided-btn {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.03em;
    padding: 13px 22px;
    border-radius: 999px;
    cursor: pointer;
  }
  .guided-btn.primary {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }
  .guided-complete-icon {
    font-size: 48px;
    margin-bottom: 12px;
  }
  .rest-row {
    margin: -4px 0 10px;
  }
  .rest-trigger {
    background: rgba(37, 99, 235, 0.1);
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    filter: brightness(1.2);
  }
  .rest-bar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    z-index: 9;
    background: rgba(25, 33, 52, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--accent);
    border-radius: 16px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    width: calc(100% - 36px);
    max-width: 640px;
  }
  .rest-bar.rest-done {
    border-color: var(--sage);
  }
  .rest-info { display: flex; flex-direction: column; }
  .rest-time {
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
    line-height: 1.1;
  }
  .rest-bar.rest-done .rest-time { color: var(--sage); }
  .rest-label {
    font-size: 11px;
    color: var(--text-dim);
  }
  .rest-controls { display: flex; gap: 6px; }
  .rest-ctrl {
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 11.5px;
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .rest-skip { color: var(--danger); }
  .stopwatch-cell { display: flex; }
  .stopwatch-btn {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 14px;
    padding: 8px 4px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .stopwatch-btn.running {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }
  input[type="number"], select {
    width: 100%;
    background: rgba(15, 20, 32, 0.7);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    padding: 8px 10px;
    font-family: 'Inter', sans-serif;
    -moz-appearance: textfield;
  }
  select { appearance: auto; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .save-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(180deg, rgba(11,15,25,0) 0%, rgba(11,15,25,0.95) 50%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    justify-content: center;
    z-index: 8;
  }
  .save-btn {
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 999px;
    padding: 13px 34px;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
    max-width: 500px;
    width: 100%;
    transition: transform 0.1s;
  }
  .save-btn:active { transform: translateY(1px); }
  .save-btn.saved { background: var(--sage); color: #042416; }
  .cardio-log {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  .cardio-log label {
    font-size: 11.5px;
    color: var(--text-dim);
    display: block;
    margin-bottom: 4px;
  }
  /* Progress view */
  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  .stat-card .num {
    font-family: 'Oswald', sans-serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--accent);
    line-height: 1.1;
  }
  .stat-card .lbl {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .chart-card {
    background: var(--card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 14px;
    margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  .chart-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .range-picker {
    display: flex;
    gap: 4px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px;
  }
  .range-btn {
    border: none;
    background: none;
    color: var(--text-dim);
    font-size: 11px;
    font-family: 'Inter', sans-serif;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .range-btn.active {
    background: var(--accent);
    color: #ffffff;
  }
  .chart-card h3 {
    font-size: 14px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: none;
    font-family: 'Inter', sans-serif;
    color: var(--text);
  }
  .chart-wrap { position: relative; height: 190px; }
  .empty-note {
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    padding: 24px 0;
  }
  .ex-picker-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text-dim);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  .settings-row input {
    max-width: 90px;
  }
</style>
</head>
<body>

<div class="sticky-header-wrap">
  <header id="siteHeader">
    <div class="head-row">
      <div>
        <h1>Weekly Split</h1>
        <p id="dateLine"></p>
      </div>
      <div class="view-toggle">
        <button id="toggleWorkout" class="active">Workout</button>
        <button id="toggleProgress">Progress</button>
      </div>
    </div>
  </header>
  <nav id="tabs"></nav>
</div>

<main id="main"></main>

<div class="guided-overlay" id="guidedOverlay" style="display:none;"></div>

<div class="rest-bar" id="restBar" style="display:none;"></div>

<div class="save-bar" id="saveBar" style="display:none;">
  <button class="save-btn" id="saveBtn">Save today's session</button>
</div>

<script>
const PLAN = {
  mon: {
    label: "Monday", focus: "Push", sub: "Chest / Shoulders / Triceps", type: "lift",
    exercises: [
      { id: "bench", name: "Bench Press (barbell or dumbbell)", sets: 4, target: "8", unit: "reps", rest: 120 },
      { id: "ohp", name: "Overhead Press", sets: 3, target: "10", unit: "reps", rest: 90 },
      { id: "incline", name: "Incline Dumbbell Press", sets: 3, target: "10", unit: "reps", rest: 90 },
      { id: "flymachine", name: "Chest Fly Machine", sets: 3, target: "12", unit: "reps", rest: 60 },
      { id: "dips", name: "Dips (weighted or bodyweight)", sets: 3, target: "10", unit: "reps", rest: 75 },
      { id: "lateral", name: "Lateral Raises", sets: 3, target: "15", unit: "reps", rest: 45 }
    ]
  },
  tue: {
    label: "Tuesday", focus: "Pull", sub: "Back / Biceps", type: "lift",
    exercises: [
      { id: "pullup", name: "Pull-ups / Lat Pulldown", sets: 4, target: "8", unit: "reps", rest: 90 },
      { id: "row", name: "Barbell or Dumbbell Rows", sets: 4, target: "8", unit: "reps", rest: 90 },
      { id: "facepull", name: "Face Pulls", sets: 3, target: "15", unit: "reps", rest: 45 },
      { id: "curl", name: "Bicep Curls", sets: 3, target: "10", unit: "reps", rest: 45 },
      { id: "shrug", name: "Shrugs", sets: 3, target: "12", unit: "reps", rest: 45 }
    ]
  },
  wed: { label: "Wednesday", focus: "Rest", sub: "Recovery day", type: "rest" },
  thu: {
    label: "Thursday", focus: "Legs", sub: "Quads / Hamstrings / Calves", type: "lift",
    exercises: [
      { id: "squat", name: "Back Squat", sets: 4, target: "8", unit: "reps", rest: 150 },
      { id: "rdl", name: "Romanian Deadlift", sets: 3, target: "10", unit: "reps", rest: 90 },
      { id: "lunge", name: "Walking Lunges", sets: 3, target: "12", unit: "reps", rest: 60 },
      { id: "legpress", name: "Leg Press", sets: 3, target: "10", unit: "reps", rest: 90 },
      { id: "calf", name: "Calf Raises", sets: 4, target: "15", unit: "reps", rest: 45 }
    ]
  },
  fri: {
    label: "Friday", focus: "Full Body + Core", sub: "Power / Core stability", type: "lift",
    exercises: [
      { id: "deadlift", name: "Deadlift", sets: 3, target: "6", unit: "reps", rest: 150 },
      { id: "pushpress", name: "Push Press", sets: 3, target: "8", unit: "reps", rest: 90 },
      { id: "plank", name: "Plank", sets: 3, target: "45", unit: "sec", rest: 45 },
      { id: "hanginglegraise", name: "Hanging Leg Raise", sets: 3, target: "12", unit: "reps", rest: 45 },
      { id: "russiantwist", name: "Russian Twists", sets: 3, target: "20", unit: "reps", rest: 30 }

  },

let guidedQueue = [];
let guidedIndex = 0;
let guidedState = null;

function buildGuidedQueue(day) {
  const workSec = settings.guidedWork || 45;
  const restSec = settings.guidedRest || 30;
  const queue = [];
  day.exercises.forEach(ex => {
    for (let s = 1; s <= ex.sets; s++) {
      queue.push({ type: "work", ex, setNum: s, duration: workSec });
      queue.push({ type: "rest", ex, setNum: s, duration: restSec });
    }
  });
  if (queue.length && queue[queue.length - 1].type === "rest") queue.pop();
  return queue;
}

function startGuidedWorkout(day) {
  guidedQueue = buildGuidedQueue(day);
  guidedIndex = 0;
  document.getElementById("guidedOverlay").style.display = "flex";
  startGuidedPhase();
}

function startGuidedPhase() {
  const item = guidedQueue[guidedIndex];
  if (guidedState && guidedState.intervalId) clearInterval(guidedState.intervalId);
  guidedState = {
    endTime: Date.now() + item.duration * 1000,
    duration: item.duration,
    paused: false,
    finished: false,
    intervalId: setInterval(tickGuided, 250)
  };
  renderGuidedOverlay();
}

function tickGuided() {
  if (!guidedState || guidedState.paused) return;
  const secsLeft = Math.max(0, Math.round((guidedState.endTime - Date.now()) / 1000));
  if (secsLeft <= 0) {
    clearInterval(guidedState.intervalId);
    beep();
    if (navigator.vibrate) { try { navigator.vibrate(150); } catch(e) {} }
    advanceGuidedPhase();
  } else {
    renderGuidedOverlay();
  }
}

function advanceGuidedPhase() {
  guidedIndex++;
  if (guidedIndex >= guidedQueue.length) {
    finishGuidedWorkout();
  } else {
    startGuidedPhase();
  }
}

function skipGuidedPhase() {
  if (guidedState && guidedState.intervalId) clearInterval(guidedState.intervalId);
  advanceGuidedPhase();
}

function pauseResumeGuided() {
  if (!guidedState || guidedState.finished) return;
  if (guidedState.paused) {
    guidedState.endTime = Date.now() + guidedState.remainingMs;
    guidedState.paused = false;
    guidedState.intervalId = setInterval(tickGuided, 250);
  } else {
    clearInterval(guidedState.intervalId);
    guidedState.remainingMs = Math.max(0, guidedState.endTime - Date.now());
    guidedState.paused = true;
  }
  renderGuidedOverlay();
}

function finishGuidedWorkout() {
  guidedState = { finished: true };
  beep();
  renderGuidedOverlay();
}

function endGuidedWorkout() {
  if (guidedState && guidedState.intervalId) clearInterval(guidedState.intervalId);
  guidedState = null;
  guidedQueue = [];
  guidedIndex = 0;
  document.getElementById("guidedOverlay").style.display = "none";
}

function renderGuidedOverlay() {
  const overlay = document.getElementById("guidedOverlay");
  if (!overlay) return;

  if (guidedState && guidedState.finished) {
    overlay.innerHTML = `
      <button class="guided-close" onclick="endGuidedWorkout()">✕</button>
      <div class="guided-complete-icon">✅</div>
      <div class="guided-exname">Workout Complete</div>
      <div class="guided-setinfo">Nice work — log your final numbers below if you haven't yet.</div>
      <div class="guided-controls">
        <button class="guided-btn primary" onclick="endGuidedWorkout()">Done</button>
      </div>`;
    return;
  }

  const item = guidedQueue[guidedIndex];
  const next = guidedQueue[guidedIndex + 1];
  const msLeft = guidedState.paused
    ? guidedState.remainingMs
    : Math.max(0, guidedState.endTime - Date.now());
  const secsLeft = Math.max(0, Math.round(msLeft / 1000));

  const totalSetsThisEx = item.ex.sets;
  const stepNum = guidedIndex + 1;
  const totalSteps = guidedQueue.length;

  let nextLabel = "";
  if (next) {
    if (next.type === "work") {
      nextLabel = next.ex.id === item.ex.id
        ? `Next: Set ${next.setNum} of ${next.ex.name}`
        : `Next: ${next.ex.name}`;
    } else {
      nextLabel = `Then: ${next.duration}s rest`;
    }
  } else {
    nextLabel = "Last one — almost done";
  }

  overlay.innerHTML = `
    <button class="guided-close" onclick="endGuidedWorkout()">✕</button>
    <div class="guided-progress">Step ${stepNum} of ${totalSteps}</div>
    <div class="guided-exname">${item.ex.name}</div>
    <div class="guided-setinfo">Set ${item.setNum} of ${totalSetsThisEx}</div>
    <div class="guided-phase ${item.type}">${item.type === "work" ? "WORK" : "REST"}</div>
    <div class="guided-timer ${item.type}">${secsLeft}</div>
    <div class="guided-next">${nextLabel}</div>
    <div class="guided-controls">
      <button class="guided-btn" onclick="pauseResumeGuided()">${guidedState.paused ? "Resume" : "Pause"}</button>
      <button class="guided-btn primary" onclick="skipGuidedPhase()">Skip</button>
    </div>`;
}

let restState = null;

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const playTone = (delay) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + delay + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.28);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.3);
    };
    playTone(0);
    playTone(0.35);
  } catch(e) {}
}

function startRestTimer(seconds, label) {
  if (restState && restState.intervalId) clearInterval(restState.intervalId);
  restState = {
    endTime: Date.now() + seconds * 1000,
    duration: seconds,
    label: label || "Rest",
    intervalId: null
  };
  renderRestBar();
  restState.intervalId = setInterval(renderRestBar, 250);
}

function adjustRestTimer(deltaSeconds) {
  if (!restState) return;
  restState.endTime += deltaSeconds * 1000;
  renderRestBar();
}

function stopRestTimer() {
  if (restState && restState.intervalId) clearInterval(restState.intervalId);
  restState = null;
  const bar = document.getElementById("restBar");
  if (bar) bar.style.display = "none";
}

function renderRestBar() {
  let bar = document.getElementById("restBar");
  if (!bar) return;
  if (!restState) { bar.style.display = "none"; return; }

  const msLeft = restState.endTime - Date.now();
  const secsLeft = Math.max(0, Math.round(msLeft / 1000));
  const mm = Math.floor(secsLeft / 60);
  const ss = String(secsLeft % 60).padStart(2, "0");

  bar.style.display = "flex";
  bar.classList.toggle("rest-done", secsLeft === 0);
  bar.innerHTML = `
    <div class="rest-info">
      <div class="rest-time">${mm}:${ss}</div>
      <div class="rest-label">${restState.label}</div>
    </div>
    <div class="rest-controls">
      <button class="rest-ctrl" onclick="adjustRestTimer(-15)">−15</button>
      <button class="rest-ctrl" onclick="adjustRestTimer(15)">+15</button>
      <button class="rest-ctrl rest-skip" onclick="stopRestTimer()">Skip</button>
    </div>`;

  if (secsLeft === 0 && !restState.alerted) {
    restState.alerted = true;
    beep();
    if (navigator.vibrate) { try { navigator.vibrate([200,100,200]); } catch(e) {} }
    setTimeout(() => { if (restState && restState.alerted) stopRestTimer(); }, 4000);
  }
}

const stopwatches = {};

function buildSetStopwatch(ex, setNum, lastSet) {
  const key = `${ex.id}-${setNum}`;
  const wrap = document.createElement("div");
  wrap.className = "stopwatch-cell";

  const hiddenInput = document.createElement("input");
  hiddenInput.type = "number";
  hiddenInput.style.display = "none";
  hiddenInput.dataset.ex = ex.id;
  hiddenInput.dataset.set = setNum;
  hiddenInput.dataset.field = "reps";
  hiddenInput.value = "";

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "stopwatch-btn";
  btn.textContent = lastSet ? `${lastSet.reps}s ↻` : "Start";

  btn.onclick = () => {
    const sw = stopwatches[key];
    if (!sw || !sw.running) {
      stopwatches[key] = { startTime: Date.now(), running: true };
      btn.classList.add("running");
      stopwatches[key].intervalId = setInterval(() => {
        const elapsed = Math.round((Date.now() - stopwatches[key].startTime) / 1000);
        btn.textContent = elapsed + "s";
      }, 250);
    } else {
      clearInterval(sw.intervalId);
      const elapsed = Math.round((Date.now() - sw.startTime) / 1000);
      stopwatches[key].running = false;
      btn.classList.remove("running");
      btn.textContent = `${elapsed}s ✓`;
      hiddenInput.value = elapsed;
    }
  };

  wrap.appendChild(btn);
  wrap.appendChild(hiddenInput);
  return wrap;
}

function todayKey() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function lastEntryFor(exId) {
  const entries = history[exId];
  if (!entries || !entries.length) return null;
  return entries[entries.length - 1];
}

function estimateLiftCalories(numSets) {
  const kg = settings.bodyweightLbs / 2.20462;
  const minutes = numSets * 2.33;
  return Math.round(5 * 3.5 * kg / 200 * minutes);
}
function estimateCardioCalories(durationMin, effort) {
  const kg = settings.bodyweightLbs / 2.20462;
  let met = 8;
  if (effort <= 4) met = 6;
  else if (effort <= 7) met = 8;
  else met = 10.5;
  return Math.round(met * 3.5 * kg / 200 * (durationMin || 0));
}

function upsertCalorieLog(date, kcal, source) {
  if (!history.calorieLog) history.calorieLog = [];
  const idx = history.calorieLog.findIndex(e => e.date === date);
  if (idx >= 0) history.calorieLog[idx] = { date, kcal, source };
  else history.calorieLog.push({ date, kcal, source });
  history.calorieLog.sort((a,b) => a.date < b.date ? -1 : 1);
}

function filterByRange(entries, range) {
  if (range === "all") return entries;
  const days = Number(range);
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  return entries.filter(e => e.date >= cutoffStr);
}

function triggerSlideTransition(action) {

  action();
  void main.offsetWidth;
  main.classList.add(direction);
}

function saveDay(day) {
  const inputs = document.querySelectorAll('#main input[data-ex]');
  const byExercise = {};
  inputs.forEach(inp => {
    const exId = inp.dataset.ex;
    const setNum = inp.dataset.set;
    const field = inp.dataset.field;
    if (!byExercise[exId]) byExercise[exId] = {};
    if (!byExercise[exId][setNum]) byExercise[exId][setNum] = {};
    byExercise[exId][setNum][field] = inp.value === "" ? null : Number(inp.value);
  });

  const date = todayKey();
  let totalSetsLogged = 0;
  Object.keys(byExercise).forEach(exId => {
    const setsObj = byExercise[exId];
    const sets = Object.keys(setsObj).sort((a,b)=>a-b).map(k => ({
      weight: setsObj[k].weight,
      reps: setsObj[k].reps
    })).filter(s => s.weight !== null || s.reps !== null);
    if (sets.length === 0) return;
    if (!history[exId]) history[exId] = [];
    history[exId].push({ date, sets });
    totalSetsLogged += sets.length;
  });

  if (totalSetsLogged > 0) {
    const kcal = estimateLiftCalories(totalSetsLogged);
    upsertCalorieLog(date, kcal, "lift");
  }
  saveHistory();

  const btn = document.getElementById("saveBtn");
  btn.textContent = "Saved";
  btn.classList.add("saved");
  setTimeout(() => renderMain(), 1000);
}

  });
  select.onchange = (e) => { progressExercise = e.target.value; renderProgressView(); };
  pickerRow.appendChild(select);
  progCard.appendChild(pickerRow);

  const exHistory = history[progressExercise] || [];
  if (exHistory.length === 0) {
    progCard.innerHTML += `<div class="empty-note">No sets logged for this exercise yet.</div>`;
  } else {
    const wrap = document.createElement("div");
    wrap.className = "chart-wrap";
    const canvas = document.createElement("canvas");
    canvas.id = "progressCanvas";
    wrap.appendChild(canvas);
    progCard.appendChild(wrap);
  }
  main.appendChild(progCard);

  document.getElementById("saveBar").style.display = "none";

  requestAnimationFrame(() => {
    drawCalorieChart();
    drawProgressChart();
  });
}

function chartTextColor() {
  return getComputedStyle(document.documentElement).getPropertyValue('--text-dim').trim() || "#94a3b8";
}
function chartGridColor() {
  return getComputedStyle(document.documentElement).getPropertyValue('--line').trim() || "rgba(255,255,255,0.08)";
}

function drawCalorieChart() {
  const canvas = document.getElementById("calorieCanvas");
  if (!canvas || typeof Chart === "undefined") return;
  const log = filterByRange(history.calorieLog || [], calorieRange);
  if (calorieChart) { calorieChart.destroy(); calorieChart = null; }
  calorieChart = new Chart(canvas, {
    type: "bar",
    data: {
      labels: log.map(e => e.date.slice(5)),
      datasets: [{
        label: "kcal",
        data: log.map(e => e.kcal),
        backgroundColor: log.map(e => e.source === "cardio" ? "#10b981" : "#2563eb"),
        borderRadius: 6,
        maxBarThickness: 26
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: chartTextColor(), font: { size: 10 } }, grid: { display: false } },
        y: { ticks: { color: chartTextColor(), font: { size: 10 } }, grid: { color: chartGridColor() }, beginAtZero: true }
      }
    }
  });
}

function drawProgressChart() {
  const canvas = document.getElementById("progressCanvas");
  if (!canvas || typeof Chart === "undefined") return;
  const allEntries = history[progressExercise] || [];
  const entries = progressRange === "all" ? allEntries : allEntries.slice(-Number(progressRange));
  const labels = entries.map(e => e.date.slice(5));
  const topWeight = entries.map(e => Math.max(0, ...e.sets.map(s => s.weight || 0)));
  const totalReps = entries.map(e => e.sets.reduce((a,s) => a + (s.reps || 0), 0));

  if (progressChart) { progressChart.destroy(); progressChart = null; }
  progressChart = new Chart(canvas, {
    type: "line",
    data: {
      labels,
      datasets: [
        {
          label: "Top set weight",
          data: topWeight,
          borderColor: "#2563eb",
          backgroundColor: "#2563eb",
          yAxisID: "y",
          tension: 0.3,
          pointRadius: 3
        },
        {
          label: "Total reps",
          data: totalReps,
          borderColor: "#10b981",
          backgroundColor: "#10b981",
          yAxisID: "y1",
          tension: 0.3,
          pointRadius: 3
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "bottom", labels: { color: chartTextColor(), font: { size: 10 }, boxWidth: 10 } }
      },
      scales: {
        x: { ticks: { color: chartTextColor(), font: { size: 10 } }, grid: { display: false } },
        y: { position: "left", ticks: { color: chartTextColor(), font: { size: 10 } }, grid: { color: chartGridColor() }, title: { display: true, text: "Weight", color: chartTextColor(), font: { size: 10 } } },
        y1: { position: "right", ticks: { color: chartTextColor(), font: { size: 10 } }, grid: { display: false }, title: { display: true, text: "Reps", color: chartTextColor(), font: { size: 10 } } }
      }
    }
  });
}

function renderMain() {
  if (currentView === "workout") renderWorkoutView();
  else renderProgressView();
}

document.getElementById("toggleWorkout").onclick = () => {
  if (currentView === "workout") return;
  triggerSlideTransition(() => {
    currentView = "workout";
    document.getElementById("toggleWorkout").classList.add("active");
    document.getElementById("toggleProgress").classList.remove("active");
    renderTabs();
    renderMain();
  });
};

document.getElementById("toggleProgress").onclick = () => {
  if (currentView === "progress") return;
  triggerSlideTransition(() => {
    currentView = "progress";
    document.getElementById("toggleProgress").classList.add("active");
    document.getElementById("toggleWorkout").classList.remove("active");
    renderTabs();
    renderMain();
  });
};

document.getElementById("dateLine").textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
renderTabs();
renderMain();
</script>

</body>
</html>
