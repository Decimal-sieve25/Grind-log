<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weekly Split">
<title>Weekly Split</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0f19;
    --bg-2: rgba(20, 26, 40, 0.7);
    --card: rgba(25, 33, 52, 0.55);
    --line: rgba(255, 255, 255, 0.08);
    --text: #f8fafc;
    --text-dim: #94a3b8;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-dim: rgba(37, 99, 235, 0.25);
    --sage: #10b981;
    --danger: #ef4444;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  h1, h2, h3, .display {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  header {
    padding: 22px 18px 0;
    background: rgba(11, 15, 25, 0.8);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    border-bottom: 1px solid var(--line);
  }
  .head-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 22px;
    margin: 0 0 2px;
    font-weight: 700;
    color: var(--text);
  }
  header p {
    margin: 0;
    font-size: 13px;
    color: var(--text-dim);
  }
  .view-toggle {
    display: flex;
    gap: 6px;
    background: var(--bg-2);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  .view-toggle button {
    border: none;
    background: none;
    color: var(--text-dim);
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 0.03em;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .view-toggle button.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 0 16px rgba(37, 99, 235, 0.4);
  }
  nav {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 0 18px;
    background: rgba(11, 15, 25, 0.8);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: calc(73px + env(safe-area-inset-top, 0px));
    z-index: 9;
  }
  nav::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    padding: 9px 14px 11px;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    border-bottom: 3px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    transition: color 0.2s;
  }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  main {
    padding: 18px;
    max-width: 640px;
    margin: 0 auto;
    padding-bottom: 100px;
    will-change: transform, opacity;
  }

  @keyframes slideInRight {
    0% { opacity: 0; transform: translateX(25px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInLeft {
    0% { opacity: 0; transform: translateX(-25px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  .slide-right { animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .slide-left { animation: slideInLeft 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

  .day-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .day-title h2 { font-size: 26px; margin: 0; font-weight: 700; }
  .day-sub { color: var(--accent); font-size: 13px; font-family: 'Oswald', sans-serif; letter-spacing: 0.03em; }
  .last-logged { font-size: 12.5px; color: var(--text-dim); margin-bottom: 18px; }
  
  .rest-card, .cardio-card {
    background: var(--card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 18px;
    text-align: left;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .rest-card h3, .cardio-card h3 { margin: 0 0 8px; font-size: 18px; color: var(--sage); }
  .rest-card p, .cardio-card p { margin: 0; color: var(--text-dim); font-size: 14.5px; line-height: 1.5; }
  
  .exercise {
    background: var(--card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  .ex-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .ex-name { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
  .ex-target { font-size: 12.5px; color: var(--text-dim); }
  .ex-history { font-size: 11.5px; color: var(--accent-dim); text-align: right; white-space: nowrap; padding-top: 2px; filter: brightness(1.4); }
  
  .sets-grid { display: grid; grid-template-columns: 28px 1fr 1fr; gap: 8px; align-items: center; }
  .set-label { font-size: 12px; color: var(--text-dim); font-family: 'Oswald', sans-serif; }
  .col-label { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  
  .start-workout-row { margin-bottom: 18px; }
  .start-workout-btn {
    width: 100%;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    margin-bottom: 8px;
    box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
  }
  .guided-config { display: flex; gap: 8px; justify-content: center; }
  .config-pill {
    background: var(--card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  
  .guided-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(11, 15, 25, 0.85);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .guided-close {
    position: absolute;
    top: calc(20px + env(safe-area-inset-top, 0px));
    right: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text-dim);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }
  .guided-progress { font-size: 12px; color: var(--text-dim); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px; }
  .guided-exname { font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 600; margin-bottom: 2px; text-transform: uppercase; }
  .guided-setinfo { font-size: 14px; color: var(--text-dim); margin-bottom: 28px; }
  .guided-phase { font-family: 'Oswald', sans-serif; font-size: 16px; letter-spacing: 0.1em; margin-bottom: 6px; }
  .guided-phase.work { color: var(--accent); }
  .guided-phase.rest { color: var(--sage); }
  .guided-timer { font-family: 'Oswald', sans-serif; font-size: 84px; font-weight: 700; line-height: 1; margin-bottom: 8px; }
  .guided-timer.work { color: var(--accent); }
  .guided-timer.rest { color: var(--sage); }
  .guided-next { font-size: 13px; color: var(--text-dim); margin-bottom: 34px; min-height: 18px; }
  .guided-controls { display: flex; gap: 12px; }
  .guided-btn {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.03em;
    padding: 13px 22px;
    border-radius: 999px;
    cursor: pointer;
  }
  .guided-btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
  .guided-complete-icon { font-size: 48px; margin-bottom: 12px; }

  .rest-row { margin: -4px 0 10px; }
  .rest-trigger {
    background: rgba(37, 99, 235, 0.1);
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .rest-bar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    z-index: 9;
    background: rgba(25, 33, 52, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--accent);
    border-radius: 16px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    width: calc(100% - 36px);
    max-width: 640px;
  }
  .rest-bar.rest-done { border-color: var(--sage); }
  .rest-info { display: flex; flex-direction: column; }
  .rest-time { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 600; color: var(--accent); line-height: 1.1; }
  .rest-bar.rest-done .rest-time { color: var(--sage); }
  .rest-label { font-size: 11px; color: var(--text-dim); }
  .rest-controls { display: flex; gap: 6px; }
  .rest-ctrl { background: var(--bg-2); border: 1px solid var(--line); color: var(--text); font-size: 11.5px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .rest-skip { color: var(--danger); }

  .stopwatch-cell { display: flex; }
  .stopwatch-btn { width: 100%; background: var(--bg-2); border: 1px solid var(--line); color: var(--text); font-size: 14px; padding: 8px 4px; border-radius: 8px; cursor: pointer; }
  .stopwatch-btn.running { background: var(--accent); color: #ffffff; border-color: var(--accent); }

  input[type="number"], select {
    width: 100%;
    background: rgba(15, 20, 32, 0.7);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    padding: 8px 10px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .save-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(180deg, rgba(11,15,25,0) 0%, rgba(11,15,25,0.95) 50%);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: center;
    z-index: 8;
  }
  .save-btn {
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 999px;
    padding: 13px 34px;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
    max-width: 500px;
    width: 100%;
  }
  .save-btn.saved { background: var(--sage); color: #042416; }

  .cardio-log { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .cardio-log label { font-size: 11.5px; color: var(--text-dim); display: block; margin-bottom: 4px; }

  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat-card { background: var(--card); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .stat-card .num { font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 600; color: var(--accent); }
  .stat-card .lbl { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

  .chart-card { background: var(--card); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 16px; padding: 16px 14px; margin-bottom: 16px; }
  .chart-head-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .range-picker { display: flex; gap: 4px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .range-btn { border: none; background: none; color: var(--text-dim); font-size: 11px; padding: 5px 10px; border-radius: 999px; cursor: pointer; }
  .range-btn.active { background: var(--accent); color: #ffffff; }
  .chart-card h3 { font-size: 14px; margin: 0; font-weight: 600; color: var(--text); font-family: 'Inter', sans-serif; text-transform: none; }
  .chart-wrap { position: relative; height: 190px; }
  .empty-note { font-size: 13px; color: var(--text-dim); text-align: center; padding: 24px 0; }
  .ex-picker-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .settings-row { display: flex; align-items: center; gap: 8px; background: var(--card); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 16px; font-size: 13px; color: var(--text-dim); }
  .settings-row input { max-width: 90px; }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div>
      <h1>Weekly Split</h1>
      <p id="dateLine"></p>
    </div>
    <div class="view-toggle">
      <button id="toggleWorkout" class="active">Workout</button>
      <button id="toggleProgress">Progress</button>
    </div>
  </div>
</header>

<nav id="tabs"></nav>
<main id="main"></main>
<div class="guided-overlay" id="guidedOverlay" style="display:none;"></div>
<div class="rest-bar" id="restBar" style="display:none;"></div>
<div class="save-bar" id="saveBar" style="display:none;">
  <button class="save-btn" id="saveBtn">Save today's session</button>
</div>

<script>
const PLAN = {
  mon: {
    label: "Monday", focus: "Push", sub: "Chest / Shoulders / Triceps", type: "lift",
    exercises: [
      { id: "bench", name: "Bench Press (barbell or dumbbell)", sets: 4, target: "8", unit: "reps", rest: 120 },
      { id: "ohp", name: "Overhead Press", sets: 3, target: "10", unit: "reps", rest: 90 },
      { id: "incline", name: "Incline Dumbbell Press", sets: 3, target: "10", unit: "reps", rest: 90 },
      { id: "flymachine", name: "Chest Fly Machine", sets: 3, target: "12", unit: "reps", rest: 60 },
      { id: "dips", name: "Dips (weighted or bodyweight)", sets: 3, target: "10", unit: "reps", rest: 75 },
      { id: "lateral", name: "Lateral Raises", sets: 3, target: "15", unit: "reps", rest: 45 }
    ]
  },
  tue: {
    label: "Tuesday", focus: "Pull", sub: "Back / Biceps", type: "lift",
    exercises: [
      { id: "pullup", name: "Pull-ups / Lat Pulldown", sets: 4, target: "8", unit: "reps", rest: 90 },
      { id: "row", name: "Barbell or Dumbbell Rows", sets: 4, target: "8", unit: "reps", rest: 90 },
      { id: "facepull", name: "Face Pulls", sets: 3, target: "15", unit: "reps", rest: 45 },
      { id: "curl", name: "Bicep Curls", sets: 3, target: "10", unit: "reps", rest: 45 },
      { id: "shrug", name: "Shrugs", sets: 3, target: "12", unit: "reps", rest: 45 }
    ]
  },
  wed: { label: "Wednesday", focus: "Rest", sub: "Recovery day", type: "rest" },
  thu: {
    label: "Thursday", focus: "Legs", sub: "Quads / Hamstrings / Calves", type: "lift",
    exercises: [
      { id: "squat", name: "Back Squat", sets: 4, target: "8", unit: "reps", rest: 150 },
      { id: "rdl", name: "Romanian Deadlift", sets: 3, target: "10", unit: "reps", rest: 90 },
      { id: "lunge", name: "Walking Lunges", sets: 3, target: "12", unit: "reps", rest: 60 },
      { id: "legpress", name: "Leg Press", sets: 3, target: "10", unit: "reps", rest: 90 },
      { id: "calf", name: "Calf Raises", sets: 4, target: "15", unit: "reps", rest: 45 }
    ]
  },
  fri: {
    label: "Friday", focus: "Full Body + Core", sub: "Power / Core stability", type: "lift",
    exercises: [
      { id: "deadlift", name: "Deadlift", sets: 3, target: "6", unit: "reps", rest: 150 },
      { id: "pushpress", name: "Push Press", sets: 3, target: "8", unit: "reps", rest: 90 },
      { id: "plank", name: "Plank", sets: 3, target: "45", unit: "sec", rest: 45 },
      { id: "hanginglegraise", name: "Hanging Leg Raise", sets: 3, target: "12", unit: "reps", rest: 45 },
      { id: "russiantwist", name: "Russian Twists", sets: 3, target: "20", unit: "reps", rest: 30 }
    ]
  },
  sun: { label: "Sunday", focus: "Lacrosse", sub: "Cardio day", type: "cardio" }
};

const DAY_ORDER = ["mon","tue","wed","thu","fri","sun"];
const EXERCISE_INDEX = {};
DAY_ORDER.forEach(k => {
  if (PLAN[k].exercises) PLAN[k].exercises.forEach(ex => EXERCISE_INDEX[ex.id] = ex);
});

let history = {};
try { history = JSON.parse(localStorage.getItem("splitHistory")) || {}; } catch(e) {}

let settings = {};
try { settings = JSON.parse(localStorage.getItem("splitSettings")) || {}; } catch(e) {}
if (!settings.bodyweightLbs) settings.bodyweightLbs = 160;

function saveHistory() { try { localStorage.setItem("splitHistory", JSON.stringify(history)); } catch(e) {} }
function saveSettings() { try { localStorage.setItem("splitSettings", JSON.stringify(settings)); } catch(e) {} }

const TAB_SEQUENCE = ["mon", "tue", "wed", "thu", "fri", "sun", "progress"];
function getCurrentTabIndex() {
  return currentView === "progress" ? TAB_SEQUENCE.indexOf("progress") : TAB_SEQUENCE.indexOf(currentDay);
}
let lastTabIndex = 0;

let guidedQueue = [], guidedIndex = 0, guidedState = null;

function buildGuidedQueue(day) {
  const workSec = settings.guidedWork || 45;
  const restSec = settings.guidedRest || 30;
  const queue = [];
  day.exercises.forEach(ex => {
    for (let s = 1; s <= ex.sets; s++) {
      queue.push({ type: "work", ex, setNum: s, duration: workSec });
      queue.push({ type: "rest", ex, setNum: s, duration: restSec });
    }
  });
  if (queue.length && queue[queue.length - 1].type === "rest") queue.pop();
  return queue;
}

function startGuidedWorkout(day) {
  guidedQueue = buildGuidedQueue(day);
  guidedIndex = 0;
  document.getElementById("guidedOverlay").style.display = "flex";
  startGuidedPhase();
}

function startGuidedPhase() {
  const item = guidedQueue[guidedIndex];
  if (guidedState && guidedState.intervalId) clearInterval(guidedState.intervalId);
  guidedState = {
    endTime: Date.now() + item.duration * 1000,
    duration: item.duration,
    paused: false,
    finished: false,
    intervalId: setInterval(tickGuided, 250)
  };
  renderGuidedOverlay();
}

function tickGuided() {
  if (!guidedState || guidedState.paused) return;
  const secsLeft = Math.max(0, Math.round((guidedState.endTime - Date.now()) / 1000));
  if (secsLeft <= 0) {
    clearInterval(guidedState.intervalId);
    beep();
    if (navigator.vibrate) { try { navigator.vibrate(150); } catch(e) {} }
    advanceGuidedPhase();
  } else {
    renderGuidedOverlay();
  }
}

function advanceGuidedPhase() {
  guidedIndex++;
  if (guidedIndex >= guidedQueue.length) finishGuidedWorkout();
  else startGuidedPhase();
}

function skipGuidedPhase() {
  if (guidedState && guidedState.intervalId) clearInterval(guidedState.intervalId);
  advanceGuidedPhase();
}

function pauseResumeGuided() {
  if (!guidedState || guidedState.finished) return;
  if (guidedState.paused) {
    guidedState.endTime = Date.now() + guidedState.remainingMs;
    guidedState.paused = false;
    guidedState.intervalId = setInterval(tickGuided, 250);
  } else {
    clearInterval(guidedState.intervalId);
    guidedState.remainingMs = Math.max(0, guidedState.endTime - Date.now());
    guidedState.paused = true;
  }
  renderGuidedOverlay();
}

function finishGuidedWorkout() {
  guidedState = { finished: true };
  beep();
  renderGuidedOverlay();
}

function endGuidedWorkout() {
  if (guidedState && guidedState.intervalId) clearInterval(guidedState.intervalId);
  guidedState = null; guidedQueue = []; guidedIndex = 0;
  document.getElementById("guidedOverlay").style.display = "none";
}

function renderGuidedOverlay() {
  const overlay = document.getElementById("guidedOverlay");
  if (!overlay) return;
  if (guidedState && guidedState.finished) {
    overlay.innerHTML = `
      <button class="guided-close" onclick="endGuidedWorkout()">✕</button>
      <div class="guided-complete-icon">✅</div>
      <div class="guided-exname">Workout Complete</div>
      <div class="guided-setinfo">Nice work — log your final numbers below.</div>
      <div class="guided-controls"><button class="guided-btn primary" onclick="endGuidedWorkout()">Done</button></div>`;
    return;
  }
  const item = guidedQueue[guidedIndex];
  const next = guidedQueue[guidedIndex + 1];
  const secsLeft = Math.max(0, Math.round((guidedState.paused ? guidedState.remainingMs : (guidedState.endTime - Date.now())) / 1000));
  
  let nextLabel = "";
  if (next) {
    nextLabel = next.type === "work" ? (next.ex.id === item.ex.id ? `Next: Set ${next.setNum} of ${next.ex.name}` : `Next: ${next.ex.name}`) : `Then: ${next.duration}s rest`;
  } else {
    nextLabel = "Last one — almost done";
  }

  overlay.innerHTML = `
    <button class="guided-close" onclick="endGuidedWorkout()">✕</button>
    <div class="guided-progress">Step ${guidedIndex + 1} of ${guidedQueue.length}</div>
    <div class="guided-exname">${item.ex.name}</div>
    <div class="guided-setinfo">Set ${item.setNum} of ${item.ex.sets}</div>
    <div class="guided-phase ${item.type}">${item.type === "work" ? "WORK" : "REST"}</div>
    <div class="guided-timer ${item.type}">${secsLeft}</div>
    <div class="guided-next">${nextLabel}</div>
    <div class="guided-controls">
      <button class="guided-btn" onclick="pauseResumeGuided()">${guidedState.paused ? "Resume" : "Pause"}</button>
      <button class="guided-btn primary" onclick="skipGuidedPhase()">Skip</button>
    </div>`;
}

let restState = null;
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const playTone = (delay) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + delay + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.28);
      osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + 0.3);
    };
    playTone(0); playTone(0.35);
  } catch(e) {}
}

function startRestTimer(seconds, label) {
  if (restState && restState.intervalId) clearInterval(restState.intervalId);
  restState = { endTime: Date.now() + seconds * 1000, duration: seconds, label: label || "Rest", intervalId: null };
  renderRestBar();
  restState.intervalId = setInterval(renderRestBar, 250);
}

function adjustRestTimer(delta) {
  if (!restState) return;
  restState.endTime += delta * 1000;
  renderRestBar();
}

function stopRestTimer() {
  if (restState && restState.intervalId) clearInterval(restState.intervalId);
  restState = null;
  const bar = document.getElementById("restBar");
  if (bar) bar.style.display = "none";
}

function renderRestBar() {
  const bar = document.getElementById("restBar");
  if (!bar) return;
  if (!restState) { bar.style.display = "none"; return; }
  const secsLeft = Math.max(0, Math.round((restState.endTime - Date.now()) / 1000));
  const mm = Math.floor(secsLeft / 60), ss = String(secsLeft % 60).padStart(2, "0");
  bar.style.display = "flex";
  bar.classList.toggle("rest-done", secsLeft === 0);
  bar.innerHTML = `
    <div class="rest-info"><div class="rest-time">${mm}:${ss}</div><div class="rest-label">${restState.label}</div></div>
    <div class="rest-controls">
      <button class="rest-ctrl" onclick="adjustRestTimer(-15)">−15</button>
      <button class="rest-ctrl" onclick="adjustRestTimer(15)">+15</button>
      <button class="rest-ctrl rest-skip" onclick="stopRestTimer()">Skip</button>
    </div>`;
  if (secsLeft === 0 && !restState.alerted) {
    restState.alerted = true;
    beep();
    if (navigator.vibrate) { try { navigator.vibrate([200,100,200]); } catch(e) {} }
    setTimeout(() => { if (restState && restState.alerted) stopRestTimer(); }, 4000);
  }
}

const stopwatches = {};
function buildSetStopwatch(ex, setNum, lastSet) {
  const key = `${ex.id}-${setNum}`, wrap = document.createElement("div");
  wrap.className = "stopwatch-cell";
  const hiddenInput = document.createElement("input");
  hiddenInput.type = "number"; hiddenInput.style.display = "none";
  hiddenInput.dataset.ex = ex.id; hiddenInput.dataset.set = setNum; hiddenInput.dataset.field = "reps";
  
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "stopwatch-btn";
  btn.textContent = lastSet ? `${lastSet.reps}s ↻` : "Start";
  btn.onclick = () => {
    const sw = stopwatches[key];
    if (!sw || !sw.running) {
      stopwatches[key] = { startTime: Date.now(), running: true };
      btn.classList.add("running");
      stopwatches[key].intervalId = setInterval(() => {
        btn.textContent = Math.round((Date.now() - stopwatches[key].startTime) / 1000) + "s";
      }, 250);
    } else {
      clearInterval(sw.intervalId);
      const elapsed = Math.round((Date.now() - sw.startTime) / 1000);
      stopwatches[key].running = false;
      btn.classList.remove("running");
      btn.textContent = `${elapsed}s ✓`;
      hiddenInput.value = elapsed;
    }
  };
  wrap.appendChild(btn); wrap.appendChild(hiddenInput);
  return wrap;
}

function todayKey() { return new Date().toISOString().slice(0,10); }
function lastEntryFor(exId) { const arr = history[exId]; return arr && arr.length ? arr[arr.length - 1] : null; }
function estimateLiftCalories(sets) { return Math.round(5 * 3.5 * (settings.bodyweightLbs / 2.20462) / 200 * (sets * 2.33)); }
function estimateCardioCalories(min, effort) {
  let met = effort <= 4 ? 6 : (effort <= 7 ? 8 : 10.5);
  return Math.round(met * 3.5 * (settings.bodyweightLbs / 2.20462) / 200 * (min || 0));
}
function upsertCalorieLog(date, kcal, source) {
  if (!history.calorieLog) history.calorieLog = [];
  const idx = history.calorieLog.findIndex(e => e.date === date);
  if (idx >= 0) history.calorieLog[idx] = { date, kcal, source };
  else history.calorieLog.push({ date, kcal, source });
  history.calorieLog.sort((a,b) => a.date < b.date ? -1 : 1);
}

let currentView = "workout";
let currentDay = (() => {
  const map = {0:"sun",1:"mon",2:"tue",3:"wed",4:"thu",5:"fri",6:"sat"};
  const d = map[new Date().getDay()];
  return PLAN[d] ? d : "mon";
})();
let progressExercise = Object.keys(EXERCISE_INDEX)[0];
let calorieChart = null, progressChart = null;
let calorieRange = "all", progressRange = "all";

function filterByRange(entries, range) {
  if (range === "all") return entries;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - Number(range));
  return entries.filter(e => e.date >= cutoff.toISOString().slice(0,10));
}

function renderTabs() {
  const nav = document.getElementById("tabs");
  if (currentView !== "workout") { nav.style.display = "none"; return; }
  nav.style.display = "flex"; nav.innerHTML = "";
  DAY_ORDER.forEach(key => {
    const btn = document.createElement("button");
    btn.className = "tab" + (key === currentDay ? " active" : "");
    btn.textContent = PLAN[key].label.slice(0,3);
    btn.onclick = () => {
      triggerSlideTransition(() => { currentDay = key; renderTabs(); renderMain(); });
    };
    nav.appendChild(btn);
  });
}

function triggerSlideTransition(action) {
  const main = document.getElementById("main");
  const newIndex = getCurrentTabIndex();
  const direction = newIndex > lastTabIndex ? "slide-right" : "slide-left";
  lastTabIndex = newIndex;
  
  main.classList.remove("slide-right", "slide-left");
  main.style.opacity = '0';
  
  setTimeout(() => {
    action();
    void main.offsetWidth;
    main.style.opacity = '1';
    main.classList.add(direction);
  }, 100);
}

function renderWorkoutView() {
  const main = document.getElementById("main"), day = PLAN[currentDay];
  main.innerHTML = "";
  
  const titleWrap = document.createElement("div");
  titleWrap.className = "day-title";
  titleWrap.innerHTML = `<h2>${day.focus}</h2><span class="day-sub">${day.label}</span>`;
  main.appendChild(titleWrap);
  
  const subLine = document.createElement("div");
  subLine.className = "last-logged";
  subLine.textContent = day.sub;
  main.appendChild(subLine);

  if (day.type === "rest") {
    main.innerHTML += `<div class="rest-card"><h3>Off day</h3><p>Recovery day. Light stretching or walking is great, letting your body adapt before the next session.</p></div>`;
    document.getElementById("saveBar").style.display = "none";
    return;
  }

  if (day.type === "cardio") {
    main.innerHTML += `
      <div class="cardio-card">
        <h3>Practice day</h3>
        <p>Lacrosse training session. Log details below to keep your calorie count accurate.</p>
        <div class="cardio-log">
          <div><label>Duration (min)</label><input type="number" id="cardioDuration" inputmode="numeric" placeholder="120"></div>
          <div><label>Perceived effort (1-10)</label><input type="number" id="cardioEffort" inputmode="numeric" placeholder="7"></div>
        </div>
      </div>`;
    const bar = document.getElementById("saveBar");
    bar.style.display = "flex";
    const btn = document.getElementById("saveBtn");
    btn.textContent = "Save practice log"; btn.classList.remove("saved");
    btn.onclick = () => {
      const duration = Number(document.getElementById("cardioDuration").value) || 0;
      const effort = Number(document.getElementById("cardioEffort").value) || 7;
      if (!history["lacrosse"]) history["lacrosse"] = [];
      const date = todayKey();
      history["lacrosse"].push({ date, duration, effort });
      upsertCalorieLog(date, estimateCardioCalories(duration, effort), "cardio");
      saveHistory();
      btn.textContent = "Saved"; btn.classList.add("saved");
      setTimeout(() => { btn.textContent = "Save practice log"; btn.classList.remove("saved"); }, 1400);
    };
    return;
  }

  main.innerHTML += `
    <div class="start-workout-row">
      <button class="start-workout-btn" id="startWorkoutBtn">▶ Start Workout</button>
      <div class="guided-config">
        <button class="config-pill" id="workDurationPill">Work: ${settings.guidedWork || 45}s</button>
        <button class="config-pill" id="restDurationPill">Rest: ${settings.guidedRest || 30}s</button>
      </div>
    </div>`;
  
  document.getElementById("startWorkoutBtn").onclick = () => startGuidedWorkout(day);
  document.getElementById("workDurationPill").onclick = (e) => {
    const opts = [40, 45, 50, 55, 60], cur = settings.guidedWork || 45;
    settings.guidedWork = opts[(opts.indexOf(cur) + 1) % opts.length];
    saveSettings(); e.target.textContent = `Work: ${settings.guidedWork}s`;
  };
  document.getElementById("restDurationPill").onclick = (e) => {
    const opts = [20, 30, 45, 60], cur = settings.guidedRest || 30;
    settings.guidedRest = opts[(opts.indexOf(cur) + 1) % opts.length];
    saveSettings(); e.target.textContent = `Rest: ${settings.guidedRest}s`;
  };

  day.exercises.forEach(ex => {
    const card = document.createElement("div");
    card.className = "exercise";
    const last = lastEntryFor(ex.id);
    const lastStr = last ? `Last (${last.date}): ` + last.sets.map(s => `${s.weight || 0}×${s.reps || 0}`).join(", ") : "No sets logged yet";
    
    card.innerHTML = `
      <div class="ex-head">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-target">Target: ${ex.sets} × ${ex.target} ${ex.unit}</div>
        </div>
        <div class="ex-history">${lastStr}</div>
      </div>
      <div class="rest-row"><button class="rest-trigger" onclick="startRestTimer(${ex.rest}, '${ex.name}')">⏱ Rest ${ex.rest}s</button></div>`;
    
    const grid = document.createElement("div");
    grid.className = "sets-grid";
    grid.innerHTML = `<div></div><div class="col-label">Weight</div><div class="col-label">${ex.unit === "sec" ? "Timer" : "Reps"}</div>`;

    for (let i = 1; i <= ex.sets; i++) {
      const lastSet = last && last.sets && last.sets[i-1] ? last.sets[i-1] : null;
      const setLbl = document.createElement("div");
      setLbl.className = "set-label"; setLbl.textContent = "S" + i;
      
      const wInput = document.createElement("input");
      wInput.type = "number"; wInput.inputMode = "decimal";
      wInput.placeholder = lastSet ? String(lastSet.weight) : "lbs";
      wInput.dataset.ex = ex.id; wInput.dataset.set = i; wInput.dataset.field = "weight";

      grid.appendChild(setLbl); grid.appendChild(wInput);

      if (ex.unit === "sec") {
        grid.appendChild(buildSetStopwatch(ex, i, lastSet));
      } else {
        const rInput = document.createElement("input");
        rInput.type = "number"; rInput.inputMode = "numeric";
        rInput.placeholder = lastSet ? String(lastSet.reps) : ex.target;
        rInput.dataset.ex = ex.id; rInput.dataset.set = i; rInput.dataset.field = "reps";
        grid.appendChild(rInput);
      }
    }
    card.appendChild(grid);
    main.appendChild(card);
  });

  const bar = document.getElementById("saveBar");
  bar.style.display = "flex";
  const btn = document.getElementById("saveBtn");
  btn.textContent = "Save today's session"; btn.classList.remove("saved");
  btn.onclick = () => saveDay();
}

function saveDay() {
  const inputs = document.querySelectorAll('#main input[data-ex]');
  const byEx = {};
  inputs.forEach(inp => {
    if (!byEx[inp.dataset.ex]) byEx[inp.dataset.ex] = {};
    byEx[inp.dataset.ex][inp.dataset.set] = byEx[inp.dataset.ex][inp.dataset.set] || {};
    byEx[inp.dataset.ex][inp.dataset.set][inp.dataset.field] = inp.value === "" ? null : Number(inp.value);
  });

  const date = todayKey();
  let totalSets = 0;
  Object.keys(byEx).forEach(exId => {
    const sets = Object.keys(byEx[exId]).sort((a,b)=>a-b).map(k => byEx[exId][k]).filter(s => s.weight !== null || s.reps !== null);
    if (!sets.length) return;
    if (!history[exId]) history[exId] = [];
    history[exId].push({ date, sets });
    totalSets += sets.length;
  });

  if (totalSets > 0) upsertCalorieLog(date, estimateLiftCalories(totalSets), "lift");
  saveHistory();

  const btn = document.getElementById("saveBtn");
  btn.textContent = "Saved"; btn.classList.add("saved");
  setTimeout(() => renderMain(), 1000);
}

function buildRangePicker(current, values, onChange, labelMap) {
  const wrap = document.createElement("div");
  wrap.className = "range-picker";
  values.forEach(v => {
    const btn = document.createElement("button");
    btn.textContent = labelMap ? labelMap[v] : (v === "all" ? "All time" : `Last ${v}d`);
    btn.className = "range-btn" + (v === current ? " active" : "");
    btn.onclick = () => onChange(v);
    wrap.appendChild(btn);
  });
  return wrap;
}

function renderProgressView() {
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="settings-row">
      <span>Bodyweight (lbs):</span>
      <input type="number" id="bwInput" inputmode="numeric" value="${settings.bodyweightLbs}">
    </div>`;
  
  main.querySelector("#bwInput").addEventListener("change", (e) => {
    const v = Number(e.target.value);
    if (v > 0) { settings.bodyweightLbs = v; saveSettings(); }
  });

  const calLog = history.calorieLog || [];
  const last7 = calLog.slice(-7);
  const total7 = last7.reduce((a,c) => a + (c.kcal || 0), 0);
  const avg7 = last7.length ? Math.round(total7 / last7.length) : 0;

  main.innerHTML += `
    <div class="stat-row">
      <div class="stat-card"><div class="num">${total7}</div><div class="lbl">Est. kcal, last 7 logged days</div></div>
      <div class="stat-card"><div class="num">${avg7}</div><div class="lbl">Avg kcal per logged day</div></div>
    </div>`;

  const calCard = document.createElement("div");
  calCard.className = "chart-card";
  const calHead = document.createElement("div");
  calHead.className = "chart-head-row";
  calHead.innerHTML = `<h3>Estimated calories burned</h3>`;
  calHead.appendChild(buildRangePicker(calorieRange, ["30", "90", "all"], (v) => { calorieRange = v; renderProgressView(); }));
  calCard.appendChild(calHead);
  
  if (!filterByRange(calLog, calorieRange).length) {
    calCard.innerHTML += `<div class="empty-note">No calorie history logged in this range yet.</div>`;
  } else {
    calCard.innerHTML += `<div class="chart-wrap"><canvas id="calorieCanvas"></canvas></div>`;
  }
  main.appendChild(calCard);

  const progCard = document.createElement("div");
  progCard.className = "chart-card";
  const progHead = document.createElement("div");
  progHead.className = "chart-head-row";
  progHead.innerHTML = `<h3>Reps &amp; weight over time</h3>`;
  progHead.appendChild(buildRangePicker(progressRange, ["10", "30", "all"], (v) => { progressRange = v; renderProgressView(); }, { "10": "Last 10", "30": "Last 30", "all": "All" }));
  progCard.appendChild(progHead);

  const pickerRow = document.createElement("div");
  pickerRow.className = "ex-picker-row";
  const select = document.createElement("select");
  Object.values(EXERCISE_INDEX).forEach(ex => {
    const opt = document.createElement("option");
    opt.value = ex.id; opt.textContent = ex.name;
    if (ex.id === progressExercise) opt.selected = true;
    select.appendChild(opt);
  });
  select.onchange = (e) => { progressExercise = e.target.value; renderProgressView(); };
  pickerRow.appendChild(select);
  progCard.appendChild(pickerRow);

  if (!(history[progressExercise] || []).length) {
    progCard.innerHTML += `<div class="empty-note">No sets logged for this exercise yet.</div>`;
  } else {
    progCard.innerHTML += `<div class="chart-wrap"><canvas id="progressCanvas"></canvas></div>`;
  }
  main.appendChild(progCard);

  document.getElementById("saveBar").style.display = "none";
  requestAnimationFrame(() => { drawCalorieChart(); drawProgressChart(); });
}

function drawCalorieChart() {
  const canvas = document.getElementById("calorieCanvas");
  if (!canvas || typeof Chart === "undefined") return;
  const log = filterByRange(history.calorieLog || [], calorieRange);
  if (calorieChart) calorieChart.destroy();
  calorieChart = new Chart(canvas, {
    type: "bar",
    data: {
      labels: log.map(e => e.date.slice(5)),
      datasets: [{ data: log.map(e => e.kcal), backgroundColor: log.map(e => e.source === "cardio" ? "#10b981" : "#2563eb"), borderRadius: 6, maxBarThickness: 26 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: "#94a3b8", font: { size: 10 } }, grid: { display: false } }, y: { ticks: { color: "#94a3b8", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.08)" }, beginAtZero: true } }
    }
  });
}

function drawProgressChart() {
  const canvas = document.getElementById("progressCanvas");
  if (!canvas || typeof Chart === "undefined") return;
  const entries = progressRange === "all" ? (history[progressExercise] || []) : (history[progressExercise] || []).slice(-Number(progressRange));
  if (progressChart) progressChart.destroy();
  progressChart = new Chart(canvas, {
    type: "line",
    data: {
      labels: entries.map(e => e.date.slice(5)),
      datasets: [
        { label: "Top weight", data: entries.map(e => Math.max(0, ...e.sets.map(s => s.weight || 0))), borderColor: "#2563eb", yAxisID: "y", tension: 0.3, pointRadius: 3 },
        { label: "Total reps", data: entries.map(e => e.sets.reduce((a,s) => a + (s.reps || 0), 0)), borderColor: "#10b981", yAxisID: "y1", tension: 0.3, pointRadius: 3 }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { position: "bottom", labels: { color: "#94a3b8", font: { size: 10 }, boxWidth: 10 } } },
      scales: {
        x: { ticks: { color: "#94a3b8", font: { size: 10 } }, grid: { display: false } },
        y: { position: "left", ticks: { color: "#94a3b8", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.08)" } },
        y1: { position: "right", ticks: { color: "#94a3b8", font: { size: 10 } }, grid: { display: false } }
      }
    }
  });
}

function renderMain() {
  if (currentView === "workout") renderWorkoutView();
  else renderProgressView();
}

document.getElementById("toggleWorkout").onclick = () => {
  if (currentView === "workout") return;
  triggerSlideTransition(() => {
    currentView = "workout";
    document.getElementById("toggleWorkout").classList.add("active");
    document.getElementById("toggleProgress").classList.remove("active");
    renderTabs(); renderMain();
  });
};

document.getElementById("toggleProgress").onclick = () => {
  if (currentView === "progress") return;
  triggerSlideTransition(() => {
    currentView = "progress";
    document.getElementById("toggleProgress").classList.add("active");
    document.getElementById("toggleWorkout").classList.remove("active");
    renderTabs(); renderMain();
  });
};

document.getElementById("dateLine").textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
renderTabs(); renderMain();
</script>
</body>
